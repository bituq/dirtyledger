name: Build data & deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SQLite database from sources
        run: pnpm ingest
      - name: Build site
        run: pnpm build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Copy database into site
        run: |
          mkdir -p packages/web/dist/data/db
          cp dist-data/dirtyledger.db packages/web/dist/data/db/0
          node -e 'const fs=require("fs");const s=fs.statSync("packages/web/dist/data/db/0").size;fs.writeFileSync("packages/web/dist/data/db-meta.json",JSON.stringify({size:s,buildId:process.env.GITHUB_SHA.slice(0,12)}))'
      - name: SPA fallback for Pages
        run: cp packages/web/dist/index.html packages/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
